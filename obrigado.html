<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Confirmação demonstrativa do formulário da Íris Drinketeria."
    >
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#f5eedf">
    <title>Simulação concluída | Íris Drinketeria</title>
    <link rel="canonical" href="https://example.com/obrigado.html">
    <link rel="icon" href="assets/brand/favicon-rounded.svg" type="image/svg+xml">
    <link rel="alternate icon" href="assets/brand/favicon.webp" type="image/webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html#inicio" aria-label="Íris Drinketeria">
        <span class="brand__mark">
          <img src="assets/brand/hero-logo.png" alt="" width="58" height="58">
        </span>
      </a>
    </header>

    <main>
      <section class="hero">
        <div class="hero__content">
          <p class="eyebrow">Demonstração</p>
          <h1>Simulação concluída</h1>
          <p class="hero__text">
            Nenhum dado foi enviado. Esta é a versão de portfólio do site da Íris Drinketeria.
          </p>

          <div class="hero__actions" aria-label="Ações">
            <a class="button button--primary" href="index.html#inicio">Voltar ao site</a>
            <a class="button button--ghost" href="index.html#orcamento">Voltar ao formulário</a>
          </div>

          <div class="hero__socials" aria-label="Redes sociais">
            <a
              class="social-link"
              data-whatsapp-link
              href="https://wa.me/5500000000000"
              target="_blank"
              rel="noopener"
              aria-label="Chamar no WhatsApp"
            >
              <img src="assets/icons/whatsapp.png" alt="" width="28" height="28">
            </a>
            <a
              class="social-link"
              href="https://www.instagram.com/"
              target="_blank"
              rel="noopener"
              aria-label="Abrir Instagram da Íris Drinketeria"
            >
              <img src="assets/icons/instagram.png" alt="" width="28" height="28">
            </a>
          </div>
        </div>

        <figure class="thanks-visual">
          <img
            src="assets/eventos/obrigado/fotoobrigado.webp"
            alt="Caipirinha da Íris Drinketeria em embalagem personalizada"
          >
        </figure>
      </section>
    </main>
    <script src="assets/js/main.js" defer></script>
  </body>
</html>
